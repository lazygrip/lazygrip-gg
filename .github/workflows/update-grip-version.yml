name: Update GRIP-EMS Version

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch latest GRIP-EMS version from Wago
        id: fetch_version
        run: |
          RESPONSE=$(curl -s -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "https://addons.wago.io/addons/grip-ems/versions?stability=stable")

          VERSION=$(echo "$RESPONSE" | python3 -c "
          import sys, re, json, html

          page_html = sys.stdin.read()

          match = re.search(r'data-page=\"([^\"]+)\"', page_html)
          if not match:
              print('Could not find data-page attribute on Wago releases page', file=sys.stderr)
              sys.exit(1)

          decoded = html.unescape(match.group(1))
          try:
              data = json.loads(decoded)
          except json.JSONDecodeError as e:
              print(f'Could not parse Wago page-data JSON: {e}', file=sys.stderr)
              sys.exit(1)

          try:
              releases = data['props']['releases']['data']
          except (KeyError, TypeError):
              print('Wago page-data JSON did not have the expected releases.data shape', file=sys.stderr)
              sys.exit(1)

          stable_releases = [r for r in releases if r.get('stability') == 'stable']
          if not stable_releases:
              print('No stable releases found in Wago page data', file=sys.stderr)
              sys.exit(1)

          # Releases are date-descending on the page, but the stability filter above is
          # what actually matters here, so pick the newest stable one explicitly rather
          # than trusting list order alone.
          newest = max(stable_releases, key=lambda r: r.get('created_at', ''))
          label = newest.get('label', '')

          if not re.match(r'^v?[12]\.\d+\.\d+\$', label):
              print(f'Wago release label \"{label}\" did not look like an addon version, refusing to proceed', file=sys.stderr)
              sys.exit(1)

          version = label if label.startswith('v') else f'v{label}'
          print(version)
          ")

          if [ -z "$VERSION" ]; then
            echo "Could not find addon version" >&2
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Read current versions from tracked files
        id: current_version
        run: |
          # Three files reference the GRIP-EMS version, and they can drift independently
          # since site edits touch them one at a time (this is exactly how src/app/page.tsx
          # ended up frozen at v2.3.19 while guide/page.tsx had already moved to v2.4.6 —
          # confirmed 2026-08-22). guide/layout.tsx currently has no version string at all
          # (it's just nav now) so it's read defensively and simply won't force an update
          # on its own while empty.
          #
          # To make sure a stale file can never hide behind an already-current one, this
          # step reports the OLDEST version found across all tracked files, and the update
          # step below unconditionally rewrites all three whenever any one of them is behind.
          LAYOUT=$(grep -o 'GRIP-EMS v[0-9]*\.[0-9]*\.[0-9]*' src/app/guide/layout.tsx | head -1)
          GUIDE=$(grep -o 'GRIP-EMS v[0-9]*\.[0-9]*\.[0-9]*' src/app/guide/page.tsx | head -1)
          HOME=$(grep -o 'GRIP-EMS v[0-9]*\.[0-9]*\.[0-9]*' src/app/page.tsx | head -1)

          echo "guide/layout.tsx: ${LAYOUT:-<none>}"
          echo "guide/page.tsx: ${GUIDE:-<none>}"
          echo "src/app/page.tsx: ${HOME:-<none>}"

          OLDEST=$(python3 -c "
          import re

          candidates = ['$LAYOUT', '$GUIDE', '$HOME']

          def version_tuple(s):
              m = re.search(r'v(\d+)\.(\d+)\.(\d+)', s)
              if not m:
                  return None
              return tuple(int(g) for g in m.groups())

          parsed = [(c, version_tuple(c)) for c in candidates if version_tuple(c)]
          if not parsed:
              print('')
          else:
              oldest = min(parsed, key=lambda p: p[1])
              print(oldest[0])
          ")

          echo "current=$OLDEST" >> $GITHUB_OUTPUT
          echo "Oldest tracked version: ${OLDEST:-<none found>}"

      - name: Check if update is needed
        id: check
        env:
          FETCHED_VERSION: ${{ steps.fetch_version.outputs.version }}
          CURRENT_VERSION: ${{ steps.current_version.outputs.current }}
        run: |
          NEW="GRIP-EMS ${FETCHED_VERSION}"
          CURRENT="${CURRENT_VERSION}"
          if [ "$NEW" = "$CURRENT" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "Already up to date: $CURRENT"
          else
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "Update needed: $CURRENT -> $NEW"
          fi

      - name: Update version strings in files
        if: steps.check.outputs.needed == 'true'
        env:
          FETCHED_VERSION: ${{ steps.fetch_version.outputs.version }}
        run: |
          NEW_VERSION="${FETCHED_VERSION}"
          sed -i "s/GRIP-EMS v[0-9]*\.[0-9]*\.[0-9]*/GRIP-EMS ${NEW_VERSION}/g" src/app/guide/layout.tsx
          sed -i "s/GRIP-EMS v[0-9]*\.[0-9]*\.[0-9]*/GRIP-EMS ${NEW_VERSION}/g" src/app/guide/page.tsx
          sed -i "s/GRIP-EMS v[0-9]*\.[0-9]*\.[0-9]*/GRIP-EMS ${NEW_VERSION}/g" src/app/page.tsx
          echo "Updated files to $NEW_VERSION"

      - name: Create pull request
        if: steps.check.outputs.needed == 'true'
        uses: peter-evans/create-pull-request@v6
        id: cpr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto-update GRIP-EMS version to ${{ steps.fetch_version.outputs.version }}"
          title: "Auto-update GRIP-EMS version to ${{ steps.fetch_version.outputs.version }}"
          body: |
            Automated update triggered by the daily version-check workflow.

            - Detected version: `${{ steps.fetch_version.outputs.version }}`
            - Previous version: `${{ steps.current_version.outputs.current }}`
            - Source: Wago Addons (addons.wago.io/addons/grip-ems)

            This PR was opened because `main` is a protected branch and no longer accepts direct pushes.
          branch: "auto/grip-ems-version-update"
          delete-branch: true
          add-paths: |
            src/app/guide/layout.tsx
            src/app/guide/page.tsx
            src/app/page.tsx

      - name: Enable auto-merge
        if: steps.check.outputs.needed == 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}" || \
            echo "Auto-merge could not be enabled automatically — the PR is still open and waiting at ${{ steps.cpr.outputs.pull-request-url }} for a manual merge."
